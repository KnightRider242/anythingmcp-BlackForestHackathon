name: Prepare compatible npm security fixes

# Narrow, trusted branch only. npm's non-force audit fixer updates lockfiles
# without installing untrusted dependency scripts. This never runs on PR code.
on:
  push:
    branches: [security/audit-and-remediation-2026-11]

permissions:
  contents: write

jobs:
  compatible-lockfile-fixes:
    if: github.repository == 'KnightRider242/anythingmcp-BlackForestHackathon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/audit-and-remediation-2026-11
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible non-force npm audit fixes
        shell: bash
        run: |
          set -euo pipefail
          for dir in . scripts/demo-video/mock-api; do
            echo "== Applying safe npm audit fix in $dir =="
            (
              cd "$dir"
              npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress                 --audit-level=critical || rc=$?
              # npm returns 1 when advisories remain; do not use --force.
              if [ "${rc:-0}" -gt 1 ]; then
                echo "::error::npm audit fix failed unexpectedly in $dir"
                exit 1
              fi
            )
          done
          echo "== Validate updated lockfiles =="
          node -e "for(const p of ['package-lock.json','scripts/demo-video/mock-api/package-lock.json'])JSON.parse(require('node:fs').readFileSync(p,'utf8'))"
          git diff --check
          # Never automatically modify version declarations or arbitrary files.
          if ! git diff --quiet -- package.json packages/backend/package.json packages/frontend/package.json packages/cli/package.json scripts/demo-video/mock-api/package.json; then
            echo "::error::npm audit fix modified a package manifest: manual review needed"
            git diff --stat
            exit 1
          fi
      - name: Show remaining vulnerabilities after safe fixes
        run: node scripts/security-audit.mjs
        continue-on-error: true
      - name: Commit only reviewed-scope lockfiles to security branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- package-lock.json scripts/demo-video/mock-api/package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible lockfile updates found."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'security: apply semver-compatible npm advisory fixes'
          git push origin HEAD:security/audit-and-remediation-2026-11
