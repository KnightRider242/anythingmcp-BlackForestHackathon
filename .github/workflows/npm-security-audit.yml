name: npm vulnerability audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/audit-and-remediation-2026-11]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit npm lockfiles (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Scan all repository npm lockfiles
        run: node scripts/security-audit.mjs
