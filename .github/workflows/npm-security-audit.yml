name: npm vulnerability audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/audit-and-remediation-2026-11]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit npm lockfiles (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Scan all repository npm lockfiles
        run: node scripts/security-audit.mjs

  compatible-lockfile-fixes:
    name: Prepare compatible lockfile fixes (trusted security PR only)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/audit-and-remediation-2026-11'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/audit-and-remediation-2026-11
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Fix advisory dependencies without force or install scripts
        shell: bash
        run: |
          set -euo pipefail
          for dir in . scripts/demo-video/mock-api; do
            echo "== Compatible lockfile fixes: $dir =="
            (cd "$dir" && npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress --audit-level=critical) || true
          done
          node -e "for(const p of ['package-lock.json','scripts/demo-video/mock-api/package-lock.json'])JSON.parse(require('node:fs').readFileSync(p,'utf8'))"
          git diff --check
          if ! git diff --quiet -- package.json packages/backend/package.json packages/frontend/package.json packages/cli/package.json scripts/demo-video/mock-api/package.json; then
            echo "::error::Dependency manifests changed unexpectedly; refusing to commit"
            git diff --stat
            exit 1
          fi
      - name: Report remaining vulnerable packages
        run: node scripts/security-audit.mjs
        continue-on-error: true
      - name: Commit only compatible lockfile updates
        shell: bash
        run: |
          set -euo pipefail
          git add -- package-lock.json scripts/demo-video/mock-api/package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible updates available."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'security: apply compatible npm advisory lockfile fixes'
          git push origin HEAD:security/audit-and-remediation-2026-11
